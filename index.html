<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f0" />
    <title>地球型歴史地図</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css?v=20260429-9" />
  </head>
  <body>
    <main class="app-shell">
      <div id="globe-stage" class="globe-stage" aria-label="地球型歴史地図"></div>

      <nav class="toolbar" aria-label="地球操作">
        <div class="rotate-tools">
          <button id="auto-rotate" type="button" title="回転を再生" aria-label="回転を再生" aria-pressed="false">▶</button>
          <button id="rotation-settings" type="button" title="再生設定" aria-label="再生設定" aria-expanded="false" aria-controls="rotation-settings-panel">⚙</button>
          <div id="rotation-settings-panel" class="rotation-settings-panel" hidden>
            <button class="rotation-mode-button" type="button" data-rotation-mode="standard" aria-pressed="true">標準</button>
            <button class="rotation-mode-button" type="button" data-rotation-mode="land" aria-pressed="false">陸地優先</button>
            <button class="rotation-mode-button" type="button" data-rotation-mode="wave" aria-pressed="false">波形</button>
            <button class="rotation-mode-button" type="button" data-rotation-mode="land-wave" aria-pressed="false">海避け波形</button>
            <div class="rotation-speed-control">
              <div class="rotation-speed-head">
                <label for="rotation-speed">速度</label>
                <output id="rotation-speed-value" for="rotation-speed">1.0x</output>
              </div>
              <input id="rotation-speed" class="rotation-speed-range" type="range" min="0.4" max="2.2" step="0.1" value="1" aria-label="地球の回転速度" />
            </div>
          </div>
        </div>
        <button id="random-pick" type="button" title="ランダム選択を開始" aria-label="ランダム選択を開始" aria-pressed="false">✦</button>
        <button id="name-language" type="button" title="地名を日本語表示に切り替え" aria-label="地名を日本語表示に切り替え" aria-pressed="false">あ</button>
      </nav>

      <aside class="info-panel" aria-live="polite">
        <div class="panel-meta">
          <span id="detail-tier">遠景</span>
          <span id="feature-count">0 regions</span>
        </div>
        <h1 id="info-title">地球型歴史地図</h1>
        <div id="info-body" class="info-body"></div>
      </aside>

      <svg id="selection-link" class="selection-link" aria-hidden="true" focusable="false" hidden>
        <line id="selection-link-line" />
      </svg>

      <section class="timeline" aria-label="時代スライダー">
        <button id="timeline-play" type="button" title="時代を再生" aria-label="時代を再生" aria-pressed="false">▶</button>
        <div class="timeline-settings-tools">
          <button id="timeline-settings" type="button" title="スライダー再生設定" aria-label="スライダー再生設定" aria-expanded="false" aria-controls="timeline-settings-panel">⚙</button>
          <div id="timeline-settings-panel" class="timeline-settings-panel" hidden>
            <button id="timeline-reverse" class="timeline-direction-button" type="button" aria-pressed="false">逆再生</button>
            <div class="timeline-speed-control">
              <div class="timeline-speed-head">
                <label for="timeline-speed">再生速度</label>
                <output id="timeline-speed-value" for="timeline-speed">1.0x</output>
              </div>
              <input id="timeline-speed" class="timeline-speed-range" type="range" min="0.25" max="4" step="0.25" value="1" aria-label="スライダー再生速度" />
            </div>
          </div>
        </div>
        <button id="era-prev" type="button" title="前の時代" aria-label="前の時代">‹</button>
        <div class="timeline-main">
          <div class="timeline-head">
            <output id="year-readout" for="era-range">2010</output>
            <h2 id="era-title" class="era-title">地球型歴史地図</h2>
          </div>
          <input id="era-range" type="range" min="0" max="0" step="1" value="0" aria-label="時代を選択" />
        </div>
        <button id="era-next" type="button" title="次の時代" aria-label="次の時代">›</button>
      </section>

      <div id="loading" class="loading" hidden>読み込み中</div>
    </main>

    <script type="module" src="./src/app.js?v=20260429-25"></script>
  </body>
</html>
